name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      memy_ref:
        description: Exact published memy tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            integration/consumer/go.sum
      - run: make install-tools
      - run: make check
  published:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Verify exact published version
        env:
          MEMY_REF: ${{ inputs.memy_ref || github.ref_name }}
        run: make test-published
