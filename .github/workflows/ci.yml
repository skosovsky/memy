name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      memy_ref:
        description: Exact published memy tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
      GOCACHE: /tmp/memy-go-build
      GOLANGCI_LINT_CACHE: /tmp/memy-golangci-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: make validate

  consumer-local:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/consumer_checks.py local --manifest consumer-local.json
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-local-manifest
          path: consumer-local.json
  consumer-published:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Published consumer graph
        env:
          MEMY_REF: ${{ inputs.memy_ref || github.ref_name }}
        run: python3 scripts/consumer_checks.py published --memy-ref "$MEMY_REF" --manifest consumer-published.json
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-published-manifest
          path: consumer-published.json
